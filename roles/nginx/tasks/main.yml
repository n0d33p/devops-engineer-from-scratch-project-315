- name: stop and remove the old Caddy container, if present
  community.docker.docker_compose_v2:
    project_src: "{{ proxy_deploy_dir }}"
    state: absent
  ignore_errors: true

- name: remove old Caddy deploy directory
  ansible.builtin.file:
    path: "{{ proxy_deploy_dir }}"
    state: absent

- name: create webroot directory for ACME HTTP-01 challenges
  ansible.builtin.file:
    path: /var/www/certbot
    state: directory
    mode: "0755"

- name: check whether a certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ app_domain }}/fullchain.pem"
  register: cert_file

- name: configure nginx (http-only pass, so certbot has something to validate against)
  ansible.builtin.include_role:
    name: geerlingguy.nginx
  vars:
    nginx_remove_default_vhost: true
    nginx_vhosts:
      - listen: "80"
        server_name: "{{ app_domain }}"
        filename: "{{ app_domain }}.conf"
        extra_parameters: |
          location /.well-known/acme-challenge/ {
            root /var/www/certbot;
          }
          location / {
          {% if cert_file.stat.exists %}
            return 301 https://$host$request_uri;
          {% else %}
            proxy_pass http://127.0.0.1:{{ app_http_port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
          {% endif %}
          }

- name: obtain/renew TLS certificate via certbot role
  ansible.builtin.include_role:
    name: geerlingguy.certbot
  vars:
    certbot_admin_email: "{{ acme_email }}"
    certbot_create_if_missing: true
    certbot_create_method: webroot
    certbot_webroot_path: /var/www/certbot
    certbot_certs:
      - domains:
          - "{{ app_domain }}"
    certbot_post_renewal: |
      systemctl reload nginx || true

- name: re-check certificate presence after certbot
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ app_domain }}/fullchain.pem"
  register: cert_file_after

- name: re-render nginx vhosts with HTTPS now that the certificate exists
  ansible.builtin.include_role:
    name: geerlingguy.nginx
  vars:
    nginx_vhosts:
      - listen: "80"
        server_name: "{{ app_domain }}"
        filename: "{{ app_domain }}.conf"
        extra_parameters: |
          location /.well-known/acme-challenge/ {
            root /var/www/certbot;
          }
          location / {
            return 301 https://$host$request_uri;
          }
      - listen: "443 ssl"
        server_name: "{{ app_domain }}"
        filename: "{{ app_domain }}-ssl.conf"
        extra_parameters: |
          ssl_certificate     /etc/letsencrypt/live/{{ app_domain }}/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/{{ app_domain }}/privkey.pem;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
          ssl_prefer_server_ciphers off;
          ssl_session_cache shared:SSL:10m;
          ssl_session_timeout 1d;
          add_header Strict-Transport-Security "max-age=63072000" always;
          location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            proxy_pass http://127.0.0.1:{{ app_http_port }};
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
          }
          location / {
            proxy_pass http://127.0.0.1:{{ app_http_port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
          }
  when: cert_file_after.stat.exists